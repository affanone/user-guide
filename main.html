<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FormHelperWidget - User Guide</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      id="prism-theme-link"
      href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script>
      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    </script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
            colors: {
              primary: "#FF5722",
              primaryDark: "#E64A19",
              bgLight: "#F3F4F6",
              bgDark: "#111827",
              cardLight: "#FFFFFF",
              cardDark: "#1F2937",
            },
          },
        },
      };
    </script>

    <style>
      [v-cloak] {
        display: none !important;
      }
      :root {
        --text-main: #1f2937;
        --text-muted: #6b7280;
        --border-color: #e5e7eb;
      }

      html.dark {
        --text-main: #f9fafb;
        --text-muted: #9ca3af;
        --border-color: #374151;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 4px;
      }
      html.dark ::-webkit-scrollbar-thumb {
        background: #4b5563;
      }

      .glass-header {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-color);
      }
      html.dark .glass-header {
        background: rgba(31, 41, 55, 0.8);
      }

      pre[class*="language-"],
      code[class*="language-"] {
        background-color: transparent !important;
        margin: 0 !important;
        border: none !important;
        box-shadow: none !important;
        font-family: "JetBrains Mono", monospace !important;
        font-size: 14px !important;
        line-height: 1.5 !important;
        text-shadow: none !important;
      }

      pre.line-numbers {
        position: relative !important;
        padding: 1.5rem !important;
        padding-left: 3.5rem !important;
      }
      .line-numbers .line-numbers-rows {
        top: 0rem !important;
        left: -58px !important;
        width: 3rem !important;
        border-right: 1px solid var(--border-color) !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .line-numbers-rows > span:before {
        color: var(--text-muted) !important;
        padding-right: 0.8em !important;
      }

      .fade-enter-active,
      .fade-leave-active {
        transition: opacity 0.3s, transform 0.3s;
      }
      .fade-enter,
      .fade-leave-to {
        opacity: 0;
        transform: translateY(10px);
      }

      .sidebar-link {
        transition: all 0.2s ease;
      }
      .sidebar-link:hover,
      .sidebar-link.active {
        background-color: rgba(255, 87, 34, 0.1);
        color: #ff5722;
        border-right: 3px solid #ff5722;
      }
      html.dark .sidebar-link.active {
        background-color: rgba(255, 87, 34, 0.2);
      }
    </style>
  </head>
  <body
    class="bg-bgLight dark:bg-bgDark antialiased min-h-screen overflow-hidden"
  >
    <div id="app" v-cloak class="flex flex-col h-screen">
      <div
        v-if="isLoading || hasError"
        class="flex-1 flex flex-col items-center justify-center bg-bgLight dark:bg-bgDark h-full"
      >
        <i
          v-if="isLoading"
          class="fa-solid fa-circle-notch fa-spin text-4xl text-primary mb-4"
        ></i>
        <i
          v-if="hasError"
          class="fa-solid fa-triangle-exclamation text-4xl text-red-500 mb-4"
        ></i>
        <h2 class="text-xl font-bold dark:text-white">
          {{ hasError ? 'Gagal Memuat Data' : 'Memuat Dokumentasi...' }}
        </h2>
        <p
          class="text-gray-500 dark:text-gray-400 mt-2 text-sm text-center px-4"
        >
          {{ hasError ? errorMessage : 'Mohon tunggu sebentar.' }}
        </p>
      </div>
      <template v-else>
        <nav
          class="glass-header z-50 px-6 py-4 flex justify-between items-center fixed w-full top-0"
        >
          <a href="index.html" class="flex items-center gap-4">
            <div
              class="w-10 h-10 bg-gradient-to-br from-primary to-orange-400 text-white rounded-xl flex items-center justify-center text-xl font-bold shadow-lg shadow-orange-500/30"
            >
              {{ appInfo.prefix }}
            </div>
            <div>
              <h1 class="text-xl font-bold tracking-tight">
                {{ appInfo.title }}
              </h1>
              <p class="text-xs text-gray-500 dark:text-gray-400">
                {{ appInfo.version }}
              </p>
            </div>
          </a>

          <div class="flex items-center gap-4">
            <div class="relative hidden md:block">
              <div class="relative flex items-center">
                <i class="fa-solid fa-search absolute left-3 text-gray-400"></i>
                <input
                  ref="searchInput"
                  v-model="searchQuery"
                  @input="handleSearch"
                  @keydown="onSearchKeyDown"
                  @focus="isSearchOpen = searchQuery.length > 0"
                  @blur="closeSearch"
                  type="text"
                  placeholder="Pencarian... (Ctrl+F)"
                  class="pl-9 pr-8 py-2 w-72 bg-gray-100 dark:bg-gray-800 border-transparent focus:border-primary dark:focus:border-primary border focus:ring-1 focus:ring-primary rounded-lg text-sm text-gray-700 dark:text-gray-200 outline-none transition-all"
                />
                <div
                  v-if="searchQuery"
                  @click="clearSearch"
                  class="absolute right-3 cursor-pointer text-gray-400 hover:text-gray-600"
                >
                  <i class="fa-solid fa-times text-xs"></i>
                </div>
              </div>

              <div
                v-show="isSearchOpen && searchResults.length > 0"
                class="absolute top-full mt-2 w-full bg-white dark:bg-cardDark border border-gray-200 dark:border-gray-700 rounded-xl shadow-xl overflow-hidden z-50 flex flex-col max-h-[350px]"
              >
                <div class="overflow-y-auto flex-1 p-2" ref="searchScroll">
                  <div
                    v-for="(result, index) in searchResults"
                    :key="result.id"
                    @mousedown.prevent="selectSearchResult(result)"
                    @mouseenter="selectedSearchIndex = index"
                    :class="['p-3 rounded-lg cursor-pointer transition-colors', selectedSearchIndex === index ? 'bg-orange-50 dark:bg-orange-900/20 border-l-4 border-primary' : 'hover:bg-gray-50 dark:hover:bg-gray-800/50 border-l-4 border-transparent']"
                  >
                    <div class="flex items-center gap-3 mb-1">
                      <i :class="result.icon + ' text-primary w-4'"></i>
                      <h4
                        class="font-bold text-sm text-gray-800 dark:text-gray-200"
                        v-html="highlightText(result.name)"
                      ></h4>
                    </div>
                    <p
                      class="text-xs text-gray-500 dark:text-gray-400 line-clamp-2"
                      v-html="highlightText(result.description)"
                    ></p>
                  </div>
                </div>
              </div>

              <div
                v-show="isSearchOpen && searchQuery && searchResults.length === 0"
                class="absolute top-full mt-2 w-full bg-white dark:bg-cardDark border border-gray-200 dark:border-gray-700 rounded-xl shadow-xl p-4 text-center z-50"
              >
                <p class="text-sm text-gray-500">
                  Tidak ada komponen ditemukan.
                </p>
              </div>
            </div>

            <button
              @click="toggleTheme"
              class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
            >
              <i class="fa-solid fa-moon" v-if="!isDarkMode"></i>
              <i class="fa-solid fa-sun" v-else></i>
            </button>
          </div>
        </nav>

        <div class="flex pt-[73px] h-full">
          <aside
            class="w-72 bg-white dark:bg-cardDark border-r border-gray-200 dark:border-gray-700 flex flex-col h-full z-10 overflow-y-auto pb-20 shadow-sm"
          >
            <div class="p-5 border-b border-gray-100 dark:border-gray-800">
              <h2
                class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-2"
              >
                Pusat Bantuan
              </h2>
              <p class="text-sm text-gray-600 dark:text-gray-400">
                {{ appInfo.description }}
              </p>
            </div>

            <div class="p-3">
              <div
                v-for="(group, groupName) in groupedComponents"
                :key="groupName"
                class="mb-4"
              >
                <h3
                  class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-2 px-3"
                >
                  {{ groupName }}
                </h3>
                <ul>
                  <li v-for="comp in group" :key="comp.id">
                    <button
                      @click="selectComponent(comp)"
                      :id="'menu-' + comp.id"
                      :class="['w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium sidebar-link mb-1 flex items-center gap-3', activeComponent && activeComponent.id === comp.id ? 'active' : 'text-gray-600 dark:text-gray-300']"
                    >
                      <i :class="comp.icon + ' w-4 text-center opacity-70'"></i>
                      {{ comp.name }}
                    </button>
                  </li>
                </ul>
              </div>
            </div>
          </aside>

          <main class="flex-1 overflow-y-auto p-8 relative scroll-smooth pb-32">
            <transition
              name="fade"
              mode="out-in"
              @after-enter="triggerHighlight"
            >
              <div
                v-if="activeComponent"
                :key="activeComponent.id"
                class="max-w-5xl mx-auto"
              >
                <div class="mb-8">
                  <div class="flex items-center gap-3 mb-2">
                    <span
                      class="px-3 py-1 bg-orange-100 dark:bg-orange-900/30 text-primary font-semibold text-xs rounded-full border border-orange-200 dark:border-orange-800/50"
                    >
                      Widget
                    </span>
                    <h2
                      class="text-3xl font-extrabold text-gray-900 dark:text-white"
                    >
                      {{ activeComponent.group }} {{ activeComponent.name }}
                    </h2>
                  </div>
                  <p
                    class="text-lg text-gray-600 dark:text-gray-300 mt-4 leading-relaxed"
                  >
                    {{ activeComponent.description }}
                  </p>
                </div>

                <div
                  v-if="activeComponent.specialNotes && activeComponent.specialNotes.length > 0"
                  class="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800/50 rounded-2xl p-6 mb-8"
                >
                  <h3
                    class="text-amber-800 dark:text-amber-400 font-bold mb-3 flex items-center gap-2"
                  >
                    <i class="fa-solid fa-triangle-exclamation"></i> Catatan
                    Penting
                  </h3>
                  <ul
                    class="list-disc list-inside text-amber-700 dark:text-amber-200/80 space-y-1 ml-1 text-sm leading-relaxed"
                  >
                    <li
                      v-for="(note, index) in activeComponent.specialNotes"
                      :key="index"
                    >
                      {{ note }}
                    </li>
                  </ul>
                </div>

                <div
                  v-if="activeComponent.additionalInfo && Object.keys(activeComponent.additionalInfo).length > 0"
                  class="bg-indigo-50 dark:bg-indigo-900/20 border border-indigo-100 dark:border-indigo-800/50 rounded-2xl p-6 mb-8"
                >
                  <h3
                    class="text-indigo-800 dark:text-indigo-300 font-bold mb-4 flex items-center gap-2"
                  >
                    <i class="fa-solid fa-circle-info"></i>
                    Informasi Tambahan & Metadata
                  </h3>

                  <div class="space-y-5">
                    <div
                      v-for="(value, key) in activeComponent.additionalInfo"
                      :key="key"
                      v-if="value !== null && value !== ''"
                    >
                      <h4
                        class="font-semibold text-indigo-900 dark:text-indigo-200 mb-2 capitalize"
                      >
                        {{ formatInfoKey(key) }}
                      </h4>

                      <div
                        v-if="Array.isArray(value)"
                        class="ml-4 bg-white/60 dark:bg-black/20 rounded-xl p-4 border border-indigo-100/50 dark:border-indigo-800/30"
                      >
                        <ul class="space-y-4">
                          <li
                            v-for="(item, idx) in value"
                            :key="idx"
                            class="flex flex-col border-b border-indigo-100 dark:border-indigo-800/50 pb-4 last:border-0 last:pb-0"
                          >
                            <template
                              v-if="typeof item === 'object' && item !== null"
                            >
                              <div
                                class="flex items-baseline gap-2 flex-wrap mb-1"
                              >
                                <code
                                  v-if="item.name"
                                  class="text-indigo-700 dark:text-indigo-300 font-bold text-sm"
                                  >{{ item.name }}</code
                                >
                                <span
                                  v-if="item.type"
                                  class="text-xs text-indigo-500/80 font-mono"
                                  >{{ item.type }}</span
                                >
                                <span
                                  v-if="item.default && item.default !== 'null' && item.default !== ''"
                                  class="text-[10px] px-2 py-0.5 rounded bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-700/50"
                                >
                                  default: {{ item.default }}
                                </span>
                              </div>
                              <p
                                v-if="item.desc"
                                class="text-sm text-indigo-600 dark:text-indigo-200/80 mt-1 leading-relaxed"
                              >
                                {{ item.desc }}
                              </p>
                            </template>

                            <template v-else>
                              <span
                                class="text-sm text-indigo-700 dark:text-indigo-200/80 flex items-center gap-2"
                              >
                                <i
                                  class="fa-solid fa-check text-indigo-400 text-xs"
                                ></i>
                                {{ item }}
                              </span>
                            </template>
                          </li>
                        </ul>
                      </div>

                      <div
                        v-else-if="typeof value === 'object' && value !== null"
                        class="ml-4 bg-white/60 dark:bg-black/20 rounded-xl p-4 border border-indigo-100/50 dark:border-indigo-800/30"
                      >
                        <ul class="space-y-2">
                          <li
                            v-for="(objValue, objKey) in value"
                            :key="objKey"
                            class="text-sm text-indigo-700 dark:text-indigo-200/80 flex items-start gap-2"
                          >
                            <i
                              class="fa-solid fa-chevron-right text-indigo-400 text-[10px] mt-1.5"
                            ></i>
                            <span
                              ><strong>{{ objKey }}:</strong> {{ objValue
                              }}</span
                            >
                          </li>
                        </ul>
                      </div>

                      <p
                        v-else
                        class="text-sm text-indigo-700 dark:text-indigo-200/80 leading-relaxed ml-4 border-l-2 border-indigo-300 dark:border-indigo-700 pl-3"
                      >
                        {{ value }}
                      </p>
                    </div>
                  </div>
                </div>

                <div
                  v-if="activeComponent.install && (activeComponent.install.pubspec || activeComponent.install.androidPermission)"
                  class="mb-8"
                >
                  <h3
                    class="text-lg font-bold text-gray-800 dark:text-gray-200 mb-4 flex items-center gap-2"
                  >
                    <i class="fa-solid fa-wrench text-sm text-gray-500"></i>
                    Instalasi & Setup
                  </h3>
                  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <div
                      v-if="activeComponent.install.pubspec"
                      class="rounded-xl overflow-hidden bg-white dark:bg-[#1d1f21] border border-gray-200 dark:border-gray-700"
                    >
                      <div
                        class="bg-gray-100 dark:bg-[#2d2d2d] px-4 py-2 border-b border-gray-200 dark:border-gray-700 text-xs font-mono text-gray-600 dark:text-gray-400"
                      >
                        pubspec.yaml
                      </div>
                      <pre
                        class="m-0 border-0 language-yaml"
                      ><code class="language-yaml">{{ activeComponent.install.pubspec.trim() }}</code></pre>
                    </div>
                    <div
                      v-if="activeComponent.install.androidPermission"
                      class="rounded-xl overflow-hidden bg-white dark:bg-[#1d1f21] border border-gray-200 dark:border-gray-700"
                    >
                      <div
                        class="bg-gray-100 dark:bg-[#2d2d2d] px-4 py-2 border-b border-gray-200 dark:border-gray-700 text-xs font-mono text-gray-600 dark:text-gray-400"
                      >
                        AndroidManifest.xml
                      </div>
                      <pre
                        class="m-0 border-0 language-xml"
                      ><code class="language-xml">{{ activeComponent.install.androidPermission.trim() }}</code></pre>
                    </div>
                  </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                  <div
                    class="bg-white dark:bg-cardDark rounded-2xl p-6 shadow-sm border border-gray-200 dark:border-gray-700"
                  >
                    <h3
                      class="text-lg font-bold mb-4 flex items-center gap-2 text-red-500"
                    >
                      <i class="fa-solid fa-asterisk text-sm"></i> Properti
                      Wajib (Required)
                    </h3>
                    <ul
                      v-if="activeComponent.mandatoryProps && activeComponent.mandatoryProps.length > 0"
                      class="space-y-3"
                    >
                      <li
                        v-for="prop in activeComponent.mandatoryProps"
                        :key="prop.name"
                        class="flex flex-col border-b border-gray-100 dark:border-gray-800 pb-3 last:border-0"
                      >
                        <div class="flex items-baseline gap-2 flex-wrap">
                          <code
                            class="text-red-500 dark:text-red-400 font-bold text-sm"
                            >{{ prop.name }}</code
                          >
                          <span class="text-xs text-gray-500 font-mono"
                            >{{ prop.type }}</span
                          >
                          <span
                            v-if="prop.default && prop.default !== 'null' && prop.default !== ''"
                            class="text-[10px] px-2 py-0.5 rounded bg-gray-100 dark:bg-gray-800 text-gray-500 border border-gray-200 dark:border-gray-700"
                          >
                            default: {{ prop.default }}
                          </span>
                        </div>
                        <p
                          class="text-sm text-gray-600 dark:text-gray-400 mt-1"
                        >
                          {{ prop.desc }}
                        </p>
                      </li>
                    </ul>
                    <p v-else class="text-sm text-gray-500 italic">
                      Tidak ada properti wajib. Dapat dipanggil secara langsung
                      tanpa parameter khusus.
                    </p>
                  </div>

                  <div
                    class="bg-white dark:bg-cardDark rounded-2xl p-6 shadow-sm border border-gray-200 dark:border-gray-700"
                  >
                    <h3
                      class="text-lg font-bold mb-4 flex items-center gap-2 text-blue-500"
                    >
                      <i class="fa-solid fa-sliders text-sm"></i> Properti
                      Spesifik (Opsional)
                    </h3>
                    <ul
                      v-if="activeComponent.optionalProps && activeComponent.optionalProps.length > 0"
                      class="space-y-3"
                    >
                      <li
                        v-for="prop in activeComponent.optionalProps"
                        :key="prop.name"
                        class="flex flex-col border-b border-gray-100 dark:border-gray-800 pb-3 last:border-0"
                      >
                        <div class="flex items-baseline gap-2 flex-wrap">
                          <code
                            class="text-blue-600 dark:text-blue-400 font-bold text-sm"
                            >{{ prop.name }}</code
                          >
                          <span class="text-xs text-gray-500 font-mono"
                            >{{ prop.type }}</span
                          >
                          <span
                            v-if="prop.default && prop.default !== 'null' && prop.default !== ''"
                            class="text-[10px] px-2 py-0.5 rounded bg-gray-100 dark:bg-gray-800 text-gray-500 border border-gray-200 dark:border-gray-700"
                          >
                            default: {{ prop.default }}
                          </span>
                        </div>
                        <p
                          class="text-sm text-gray-600 dark:text-gray-400 mt-1"
                        >
                          {{ prop.desc }}
                        </p>
                      </li>
                    </ul>
                    <p v-else class="text-sm text-gray-500 italic">
                      Tidak ada properti opsional.
                    </p>
                  </div>
                </div>

                <div
                  v-if="activeComponent.behaviors && activeComponent.behaviors.length > 0"
                  class="bg-white dark:bg-cardDark rounded-2xl p-6 shadow-sm border border-gray-200 dark:border-gray-700 mb-8"
                >
                  <h3
                    class="text-lg font-bold mb-4 flex items-center gap-2 text-green-600 dark:text-green-400"
                  >
                    <i class="fa-solid fa-bolt text-sm"></i> Behaviors &
                    Lifecycle
                  </h3>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div
                      v-for="bhv in activeComponent.behaviors"
                      :key="bhv.name"
                      class="flex flex-col border-b border-gray-100 dark:border-gray-800 pb-3"
                    >
                      <div class="flex items-baseline gap-2 flex-wrap">
                        <code
                          class="text-green-600 dark:text-green-400 font-medium text-sm"
                          >{{ bhv.name }}</code
                        >
                        <span class="text-xs text-gray-400 font-mono"
                          >{{ bhv.type }}</span
                        >
                      </div>
                      <p
                        class="text-sm text-gray-600 dark:text-gray-400 mt-1 leading-relaxed"
                      >
                        {{ bhv.desc }}
                      </p>
                    </div>
                  </div>
                </div>

                <div
                  v-if="compMethods.length > 0"
                  class="bg-white dark:bg-cardDark rounded-2xl p-6 shadow-sm border border-gray-200 dark:border-gray-700 mb-8"
                >
                  <h3
                    class="text-lg font-bold mb-4 flex items-center gap-2 text-purple-600 dark:text-purple-400"
                  >
                    <i class="fa-solid fa-code text-sm"></i> Methods / Actions
                  </h3>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div
                      v-for="method in compMethods"
                      :key="method.name"
                      class="flex flex-col border-b border-gray-100 dark:border-gray-800 pb-3"
                    >
                      <div class="flex items-baseline gap-2 flex-wrap">
                        <code
                          class="text-purple-600 dark:text-purple-400 font-medium text-sm"
                          >{{ method.name }}</code
                        >
                        <span class="text-xs text-gray-400 font-mono"
                          >{{ method.type }}</span
                        >
                      </div>
                      <p
                        class="text-sm text-gray-600 dark:text-gray-400 mt-1 leading-relaxed"
                      >
                        {{ method.desc }}
                      </p>
                    </div>
                  </div>
                </div>

                <div
                  v-if="activeComponent.code"
                  class="rounded-2xl shadow-sm overflow-hidden bg-white dark:bg-[#1d1f21] border border-gray-200 dark:border-gray-700"
                >
                  <div
                    class="bg-gray-50 dark:bg-[#2d2d2d] px-4 py-2 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center"
                  >
                    <div class="flex items-center gap-3">
                      <div class="flex gap-1.5">
                        <div
                          class="w-3 h-3 rounded-full bg-red-400 dark:bg-red-500"
                        ></div>
                        <div
                          class="w-3 h-3 rounded-full bg-yellow-400 dark:bg-yellow-500"
                        ></div>
                        <div
                          class="w-3 h-3 rounded-full bg-green-400 dark:bg-green-500"
                        ></div>
                      </div>
                      <span
                        class="text-xs font-mono text-gray-500 dark:text-gray-300"
                        >Contoh Penggunaan Dart</span
                      >
                    </div>
                    <button
                      @click="copyCode"
                      class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition text-xs flex items-center gap-1.5 px-2 py-1 rounded hover:bg-gray-200 dark:hover:bg-gray-600"
                    >
                      <i
                        :class="copied ? 'fa-solid fa-check text-green-500' : 'fa-regular fa-copy'"
                      ></i>
                      <span v-if="copied" class="text-green-500 font-medium"
                        >Tersalin</span
                      >
                      <span v-else>Salin</span>
                    </button>
                  </div>
                  <pre
                    class="line-numbers m-0 border-0 language-dart"
                  ><code class="language-dart">{{ activeComponent.code }}</code></pre>
                </div>
              </div>
            </transition>
          </main>
        </div></template
      >
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-dart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>

    <script>
      new Vue({
        el: "#app",
        data: {
          appInfo: { prefix: "", title: "", description: "", version: "" },
          components: [],
          activeComponent: null,
          isDarkMode: false,
          copied: false,
          searchQuery: "",
          searchResults: [],
          isSearchOpen: false,
          selectedSearchIndex: -1,
          isLoading: true,
          hasError: false,
          errorMessage: "",
        },
        computed: {
          groupedComponents() {
            return this.components.reduce((acc, comp) => {
              (acc[comp.group] = acc[comp.group] || []).push(comp);
              return acc;
            }, {});
          },
          compMethods() {
            if (!this.activeComponent || !this.activeComponent.methods)
              return [];
            return this.activeComponent.methods;
          },
        },
        created() {
          this.fetchDocumentationData();
        },
        mounted() {
          window.addEventListener("popstate", this.handlePopState);
          window.addEventListener("keydown", this.handleGlobalSearch);

          this.isDarkMode = document.documentElement.classList.contains("dark");

          this.$nextTick(() => {
            this.triggerHighlight();
          });
        },
        beforeDestroy() {
          window.removeEventListener("keydown", this.handleGlobalSearch);
          window.removeEventListener("popstate", this.handlePopState);
        },
        methods: {
          async fetchDocumentationData() {
            const urlParams = new URLSearchParams(window.location.search);
            const fileName = urlParams.get("ug");
            const targetFile = fileName ? `${fileName}.json` : "helper.json";
            try {
              const response = await fetch(`data/${targetFile}`);
              if (!response.ok)
                throw new Error(
                  `File ${targetFile} tidak ditemukan (Error ${response.status}).`
                );

              const data = await response.json();
              this.appInfo = data.appInfo;
              this.components = data.docsData;
              this.isLoading = false;
              this.handlePopState();
            } catch (error) {
              console.error(error);
              this.hasError = true;
              this.errorMessage = error.message;
              this.isLoading = false;
            }
          },
          handleGlobalSearch(e) {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f") {
              e.preventDefault();
              if (this.$refs.searchInput) {
                this.$refs.searchInput.focus();
              }
            }
          },
          handleSearch() {
            if (!this.searchQuery.trim()) {
              this.searchResults = [];
              this.isSearchOpen = false;
              return;
            }
            const q = this.searchQuery.toLowerCase();
            this.searchResults = this.components.filter(
              (c) =>
                c.name.toLowerCase().includes(q) ||
                c.description.toLowerCase().includes(q)
            );
            this.isSearchOpen = true;
            this.selectedSearchIndex = this.searchResults.length > 0 ? 0 : -1;
          },
          onSearchKeyDown(e) {
            if (!this.isSearchOpen || this.searchResults.length === 0) return;

            if (e.key === "ArrowDown") {
              e.preventDefault();
              this.selectedSearchIndex =
                (this.selectedSearchIndex + 1) % this.searchResults.length;
              this.scrollToSearchSelection();
            } else if (e.key === "ArrowUp") {
              e.preventDefault();
              this.selectedSearchIndex =
                (this.selectedSearchIndex - 1 + this.searchResults.length) %
                this.searchResults.length;
              this.scrollToSearchSelection();
            } else if (e.key === "Enter") {
              e.preventDefault();
              if (this.selectedSearchIndex >= 0) {
                this.selectSearchResult(
                  this.searchResults[this.selectedSearchIndex]
                );
              }
            } else if (e.key === "Escape") {
              this.clearSearch();
              this.$refs.searchInput.blur();
            }
          },
          scrollToSearchSelection() {
            this.$nextTick(() => {
              const container = this.$refs.searchScroll;
              if (container && container.children[this.selectedSearchIndex]) {
                const el = container.children[this.selectedSearchIndex];
                const offsetBottom = el.offsetTop + el.offsetHeight;
                const scrollBottom =
                  container.scrollTop + container.offsetHeight;

                if (offsetBottom > scrollBottom) {
                  container.scrollTop = offsetBottom - container.offsetHeight;
                } else if (el.offsetTop < container.scrollTop) {
                  container.scrollTop = el.offsetTop;
                }
              }
            });
          },
          selectSearchResult(comp) {
            this.selectComponent(comp);
            this.clearSearch();
            if (this.$refs.searchInput) {
              this.$refs.searchInput.blur();
            }
            setTimeout(() => {
              this.scrollToActiveMenu();
            }, 200);
          },
          clearSearch() {
            this.searchQuery = "";
            this.searchResults = [];
            this.isSearchOpen = false;
            this.selectedSearchIndex = -1;
          },
          closeSearch() {
            setTimeout(() => {
              this.isSearchOpen = false;
            }, 200);
          },
          highlightText(text) {
            if (!this.searchQuery) return text;
            const regex = new RegExp(`(${this.searchQuery})`, "gi");
            return text.replace(
              regex,
              '<span class="bg-orange-200 dark:bg-orange-900/60 text-orange-900 dark:text-orange-100 rounded px-0.5">$1</span>'
            );
          },
          scrollToActiveMenu() {
            this.$nextTick(() => {
              if (!this.activeComponent) return;
              const menuEl = document.getElementById(
                "menu-" + this.activeComponent.id
              );
              if (menuEl) {
                menuEl.scrollIntoView({ block: "center", behavior: "smooth" });
              }
            });
          },
          selectComponent(comp) {
            this.activeComponent = comp;
            const url = new URL(window.location);
            url.searchParams.set("id", comp.id);
            window.history.pushState({}, "", url);
            const mainArea = document.querySelector("main");
            if (mainArea) {
              setTimeout(() => {
                mainArea.scrollTo({ top: 0, behavior: "instant" });
              }, 300);
            }
          },
          toggleTheme() {
            this.isDarkMode = !this.isDarkMode;
            if (this.isDarkMode) {
              document.documentElement.classList.add("dark");
            } else {
              document.documentElement.classList.remove("dark");
            }
          },
          formatInfoKey(key) {
            return key.replace(/([A-Z])/g, " $1").trim();
          },
          copyCode() {
            navigator.clipboard.writeText(this.activeComponent.code);
            this.copied = true;
            setTimeout(() => {
              this.copied = false;
            }, 2000);
          },
          triggerHighlight() {
            this.$nextTick(() => {
              Prism.highlightAll();
            });
          },
          handlePopState() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get("id");
            if (id) {
              const found = this.components.find((c) => c.id === id);
              this.activeComponent = found
                ? found
                : this.components.length > 0
                ? this.components[0]
                : null;
            } else {
              this.activeComponent =
                this.components.length > 0 ? this.components[0] : null;
            }
            setTimeout(() => {
              this.scrollToActiveMenu();
            }, 200);
          },
        },
      });
    </script>
  </body>
</html>
